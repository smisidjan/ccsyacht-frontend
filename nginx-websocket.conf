# Nginx configuration for WebSocket proxy
# Add this to your papertrail.ccsyacht.com server block

# WebSocket proxy for Reverb
location /reverb {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout settings for WebSocket
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 60s;

    # Buffer settings
    proxy_buffering off;
    proxy_cache off;

    # Optional: Add CORS headers if needed
    add_header Access-Control-Allow-Origin "https://papertrail.ccsyacht.com" always;
    add_header Access-Control-Allow-Credentials "true" always;
}

# Optional: Separate location for WebSocket app connection
location ~ ^/apps/.*/channels {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
    proxy_buffering off;
}