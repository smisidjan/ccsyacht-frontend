name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # This is linux/amd64!

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: production
          platforms: linux/amd64

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 167.235.135.241
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Stop existing container
            docker compose -f /root/ccsyacht-frontend/docker-compose.prod.yml down || true

            # Update docker-compose to use new image
            cat > /root/ccsyacht-frontend/docker-compose.prod.yml << 'EOF'
            version: '3.8'
            services:
              frontend:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                ports:
                  - "3000:3000"
                restart: unless-stopped
                environment:
                  - NODE_ENV=production
                  - NEXT_PUBLIC_API_URL=https://api.papertrail.ccsyacht.com/api
                  - NEXT_PUBLIC_APP_NAME=Papertrail Marine by CCS Yacht
                  - NEXT_PUBLIC_REVERB_APP_KEY=papertrail-prod-key-2024
                  - NEXT_PUBLIC_REVERB_HOST=papertrail.ccsyacht.com
                  - NEXT_PUBLIC_REVERB_PORT=443
                  - NEXT_PUBLIC_REVERB_SCHEME=https
                env_file:
                  - .env
            EOF

            # Start new container
            docker compose -f /root/ccsyacht-frontend/docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f